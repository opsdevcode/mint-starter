name: Mint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mint:
    name: mint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: opsdevcode/mint-action@2b35bb6a2da3f7f7e41254700aa030b3c18bfd1d # v0.2.0-alpha.0
        with:
          project: .
          command: check
          language-tag: v0.8.0-alpha.2
          language-wheel: specmint-0.8.0a2-py3-none-any.whl
      - name: Require native SARIF
        if: always()
        run: |
          set -euo pipefail
          test -f mint.sarif
          python3 -c 'import json; body=json.load(open("mint.sarif")); assert body["version"]=="2.1.0"; assert body["runs"][0]["tool"]["driver"]["name"]=="mint"'
